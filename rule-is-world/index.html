<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rule Is World</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">TINY-GAMES / DAY 02</p>
        <h1>RULE IS WORLD</h1>
      </div>
      <div class="actions">
        <button id="levelBtn" type="button">Level 1</button>
        <button id="undoBtn" type="button">Undo</button>
        <button id="resetBtn" type="button">Reset</button>
      </div>
    </header>

    <section class="layout">
      <div class="game-panel">
        <div id="levelTitle" class="level-title"></div>
        <div id="board" class="board" aria-label="Rule puzzle board"></div>
        <p id="levelHint" class="level-hint"></p>
      </div>

      <aside class="sidebar">
        <section>
          <p class="eyebrow">ACTIVE RULES</p>
          <div id="rules" class="rules"></div>
        </section>
        <section>
          <p class="eyebrow">CONTROLS</p>
          <p>Move: Arrow keys / WASD</p>
          <p>Undo: Z</p>
          <p>Reset: R</p>
        </section>
        <section>
          <p class="eyebrow">DAY 02</p>
          <p class="muted">New today: noun transformation, undo history, and a second level built around changing what an object is.</p>
        </section>
      </aside>
    </section>

    <div id="winOverlay" class="overlay" hidden>
      <div class="win-card">
        <p class="eyebrow">RULE SATISFIED</p>
        <h2>YOU IS WIN.</h2>
        <p id="winText"></p>
        <div class="win-actions">
          <button id="nextBtn" type="button">Next level</button>
          <button id="playAgainBtn" type="button">Play again</button>
        </div>
      </div>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
