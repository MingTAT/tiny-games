<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080f20"><title>Words Change Worlds — Puzzle Edition</title><link rel="stylesheet" href="styles.css"></head>
<body>
<main class="game-shell">
  <header class="game-topbar">
    <button id="menu-toggle" class="nav-text" aria-label="打开关卡菜单">☰ <span>关卡地图</span></button>
    <div class="brand"><div class="brand-kicker">A WORLD OF MOVABLE RULES</div><h1>WORDS <span>CHANGE</span> WORLDS</h1></div>
    <button data-action="restart" class="nav-text">↻ <span>重来</span></button>
  </header>
  <div class="level-line"><span id="level-title"></span><span class="meta">MOVES <b id="turn">0</b></span></div>
  <section id="game-area" class="game-area">
    <canvas id="world" width="960" height="690" aria-label="规则文字拼图地图"></canvas>
    <div id="win-overlay" class="win-overlay" hidden role="dialog" aria-label="关卡完成">
      <div class="win-panel"><div class="win-star">✦</div><h2 id="victory-title">PUZZLE CLEARED</h2><p id="victory-detail"></p><button id="next-level" class="next-level">下一关 →</button><div class="win-actions"><button id="replay-level">重玩本关</button><button id="view-levels">关卡地图</button></div><div class="key-tip">ENTER · 下一关</div></div>
    </div>
  </section>
  <div class="bottom-bar"><div class="key-guide"><span><kbd>↑ ↓ ← →</kbd> 移动</span><span><kbd>Z</kbd> 撤销</span><span><kbd>Y</kbd> 重做</span><span><kbd>R</kbd> 重来</span></div><div class="quick-actions"><button data-action="undo">↶ 撤销</button><button data-action="redo">↷ 重做</button><button data-action="hint">提示 ✧</button></div></div>
  <div id="hint" class="hint" aria-live="polite"></div><div class="touch-controls"><div class="touch-cross"><button data-action="up" aria-label="上">↑</button><div><button data-action="left" aria-label="左">←</button><button data-action="down" aria-label="下">↓</button><button data-action="right" aria-label="右">→</button></div></div><button data-action="undo">撤销</button></div>
  <div id="menu-overlay" class="menu-overlay" hidden><div class="menu-card"><div class="menu-head"><div><span class="brand-kicker">CHOOSE YOUR PUZZLE</span><h2>关卡地图</h2></div><button id="menu-close" aria-label="关闭关卡菜单">✕</button></div><p class="menu-note">01–18：旧版教学与原型 · 19 起：重新设计的正式谜题。完成的关卡显示 ✦。</p><div id="levels" class="levels"></div><details><summary>有效规则（调试）</summary><div id="rules" class="rules"></div></details><details><summary>事件记录（调试）</summary><pre id="trace"></pre></details><div class="menu-bottom"><span id="status">进行中</span><button id="menu-return">返回棋盘 →</button></div></div></div>
  <div class="footer-note">An original puzzle prototype · Move the words, rethink the world.</div>
</main><script src="game.js"></script></body></html>
