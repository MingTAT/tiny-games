<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Last Check-In</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="grain"></div><div class="vignette"></div>
  <main class="game-shell">
    <header class="topbar">
      <div><p id="dateLine" class="eyebrow"></p><h1 id="gameTitle"></h1></div>
      <div class="top-actions">
        <div class="lang-switch" role="group" aria-label="Language / 语言 / 言語">
          <button id="langEn" class="lang-btn active" type="button">EN</button>
          <button id="langZh" class="lang-btn" type="button">中文</button>
          <button id="langJa" class="lang-btn" type="button">日本語</button>
        </div>
        <button id="soundBtn" class="ghost-btn" type="button" aria-pressed="false"></button>
        <button id="resetBtn" class="ghost-btn" type="button"></button>
      </div>
    </header>

    <section class="briefing">
      <p id="briefingMain"></p>
      <p id="briefingSub" class="muted"></p>
    </section>

    <section id="scene" class="scene">
      <div class="window"><span class="rain rain-a"></span><span class="rain rain-b"></span><span id="windowCopy" class="window-copy"></span></div>
      <div class="lamp"><div class="lamp-shade"></div><div class="lamp-neck"></div><div class="lamp-glow"></div></div>

      <button class="scene-object register" data-evidence="register" type="button"><span class="object-label" data-object-label="register"></span><span class="book-lines"></span></button>
      <button class="scene-object keys" data-evidence="keys" type="button"><span class="object-label" data-object-label="keys"></span><span class="key-row"><i>108</i><i>203</i><i>206</i><i>214</i></span></button>
      <button class="scene-object note" data-evidence="note" type="button"><span class="object-label" data-object-label="note"></span><span id="notePreview" class="handwriting"></span></button>
      <button class="scene-object paper" data-evidence="paper" type="button"><span class="object-label" data-object-label="paper"></span><strong id="paperName"></strong><small id="paperHeadline"></small></button>
      <button class="scene-object letter" data-evidence="letter" type="button"><span class="object-label" data-object-label="letter"></span><span id="stampText" class="stamp"></span></button>
      <button class="scene-object photo" data-evidence="photo" type="button"><span class="object-label" data-object-label="photo"></span><span class="photo-silhouette one"></span><span class="photo-silhouette two"></span><span class="photo-silhouette three"></span></button>

      <div id="deskClock" class="desk-clock">02:17</div><div class="desk-edge"></div>
    </section>

    <aside class="caseboard">
      <div class="caseboard-head"><div><p id="caseLabel" class="eyebrow"></p><h2 id="evidenceHeading"></h2></div><div class="evidence-count"><span id="count">0</span>/6</div></div>
      <div id="clueList" class="clue-list" aria-live="polite"></div>
      <button id="accuseBtn" class="accuse-btn" type="button" disabled></button>
      <p id="unlockText" class="unlock-text"></p>
    </aside>
  </main>

  <div id="overlay" class="overlay" hidden>
    <div class="evidence-card" role="dialog" aria-modal="true" aria-labelledby="evidenceTitle">
      <button id="closeOverlay" class="close-btn" type="button">×</button>
      <p id="evidenceKicker" class="eyebrow"></p><h2 id="evidenceTitle"></h2>
      <div id="evidenceVisual" class="evidence-visual"></div>
      <p id="evidenceBody" class="evidence-body"></p><p id="evidenceObservation" class="observation"></p>
    </div>
  </div>

  <div id="accuseOverlay" class="overlay" hidden>
    <div class="evidence-card accusation-card" role="dialog" aria-modal="true" aria-labelledby="accuseTitle">
      <button id="closeAccuse" class="close-btn" type="button">×</button>
      <p id="finalLabel" class="eyebrow"></p><h2 id="accuseTitle"></h2><p id="accuseHint" class="muted"></p>
      <div class="suspect-grid">
        <button class="suspect" data-suspect="hana" type="button"><strong>Hana Mori</strong><span data-room="hana"></span></button>
        <button class="suspect" data-suspect="leon" type="button"><strong>Leon Bell</strong><span data-room="leon"></span></button>
        <button class="suspect" data-suspect="clara" type="button"><strong>Clara Weiss</strong><span data-room="clara"></span></button>
        <button class="suspect" data-suspect="elias" type="button"><strong>Elias Vale</strong><span data-room="elias"></span></button>
      </div>
    </div>
  </div>

  <div id="endingOverlay" class="overlay" hidden>
    <div class="ending-card" role="dialog" aria-modal="true" aria-labelledby="endingTitle">
      <p id="endingKicker" class="eyebrow"></p><h2 id="endingTitle"></h2><p id="endingBody"></p>
      <button id="endingBtn" class="accuse-btn" type="button"></button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
